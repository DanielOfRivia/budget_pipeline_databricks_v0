# This is a Declarative Automation Bundle definition for budget_v1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: budget_v1
  uuid: 08595ff9-b522-4642-8c6c-83d9e36aa363

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity Catalog catalog for the pipeline
    default: workspace
  schema:
    description: Default schema for the pipeline
    default: budget_bundle

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ac6ead32-690e.cloud.databricks.com
    variables:
      catalog: workspace
      schema: budget_bundle
